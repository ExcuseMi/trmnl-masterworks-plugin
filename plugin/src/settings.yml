---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor:
polling_url: ''
polling_headers: ''
polling_body: ''
id: 543128
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: "<p><b>A famous public-domain artwork, new at every refresh.</b></p><p>Over 5,000 paintings, prints, posters and illustrations: landscapes, seas, cities, modern and abstract art, posters and Art Nouveau, nature illustration, Japanese prints, flowers and still life, portraits, religious art, mythology, history and everyday scenes.</p><p>Well-known works come up more often. With the label and the info off, a work fills the screen when that crops little; otherwise it hangs whole on a white or black mat, with its label beside or under it. No text ever covers the art.</p><p>Source: Wikidata and Wikimedia Commons.</p>"
  category: art,images
  github_url: https://github.com/ExcuseMi/trmnl-masterworks-plugin
  learn_more_url: https://www.wikidata.org
- keyname: family_friendly
  group: Selection
  field_type: boolean
  name: Family friendly
  default: 'true'
  optional: true
  help_text: "<ul><li><b>On</b> (default): leaves out works that clearly show nudity or graphic violence (a nude as the subject, a beheading). Famous works with a draped or distant nude, a battle or a death scene stay. Careful, but not perfect.</li><li><b>Off</b>: all works.</li></ul>"
- keyname: genres
  group: Selection
  field_type: select
  multiple: true
  name: Genres
  optional: true
  help_text: "<p>Tick the kinds of work you want. Nothing ticked gives the default mix: landscapes, seas, cities, nature illustration, Japanese prints, modern and abstract art and posters more often; flowers and still life, religious art, portraits and history painting less often.</p><p>With too few works of the ticked kinds, the default mix is used for that refresh.</p><ul><li>Portraits only: tick only Portraits.</li><li>No portraits: tick every kind but Portraits.</li></ul>"
  options:
  - Landscapes and seas: landscapes
  - Cities: cities
  - Flowers and still life: flowers_still_life
  - Nature illustration: nature
  - Japanese prints: japanese_prints
  - Modern and abstract: modern
  - Posters and Art Nouveau: posters
  - Religious: religious
  - History and mythology: history_myth
  - Everyday scenes: everyday
  - Portraits: portraits
- keyname: movement
  group: Selection
  field_type: select
  name: Period
  default: all
  optional: true
  help_text: "<p>Only works of one movement or period. With few works in a period, the filter is ignored for that refresh.</p>"
  options:
  - All: all
  - Renaissance: Renaissance
  - Baroque: Baroque
  - Impressionism: Impressionism
  - Post-Impressionism: Post-Impressionism
  - Dutch Golden Age: Dutch Golden Age
  - Realism: Realism
  - Mannerism: Mannerism
  - Romanticism: Romanticism
  - Neoclassicism: Neoclassicism
  - Rococo: Rococo
- keyname: show_date
  group: Info
  field_type: boolean
  name: Show the date
  default: 'false'
  optional: true
  conditional_validation:
  - when: 'true'
    hidden:
    - fill
  help_text: "<p>The day number, weekday and month in your account's language, beside or under the artwork.</p><p>The date, weather and agenda each have their own toggle; any combination works.</p>"
- keyname: show_weather
  group: Info
  field_type: boolean
  name: Show the weather
  default: 'false'
  optional: true
  conditional_validation:
  - when: 'true'
    hidden:
    - fill
  - when: 'false'
    hidden:
    - weather_location
    - temperature_unit
  help_text: "<p>The temperature and a short forecast line from Open-Meteo.</p><p>Needs a <b>weather location</b>. Without one, or when the weather cannot be fetched, it is left out.</p>"
- keyname: show_agenda
  group: Info
  field_type: boolean
  name: Show the agenda
  default: 'false'
  optional: true
  conditional_validation:
  - when: 'true'
    hidden:
    - fill
  - when: 'false'
    hidden:
    - ics_url
  help_text: "<p>Your next two events of today (tomorrow's after 6 pm, or when none are left), from a calendar link.</p><p>Needs the <b>calendar link</b> below; without one nothing shows.</p>"
- keyname: label
  field_type: boolean
  name: Museum label
  default: 'true'
  optional: true
  conditional_validation:
  - when: 'true'
    hidden:
    - fill
  help_text: "<ul><li><b>On</b>: title, artist and year, then technique and where the work hangs, as on a museum wall.</li><li><b>Off</b>: only the artwork.</li></ul>"
- keyname: fill
  field_type: boolean
  name: Fill the screen
  default: 'true'
  optional: true
  help_text: "<p>Only shown with the museum label, the date, the weather and the agenda all off (then there is nothing but the artwork).</p><ul><li><b>On</b> (default): a work that fills the screen edge to edge while cropping at most 15 % does so; other works hang whole on a white or black mat.</li><li><b>Off</b>: only a work that needs almost no cropping (5 %) fills the screen.</li></ul><p>With the label or any info on, the work always hangs on its mat, with no text over it.</p>"
- keyname: ics_url
  group: Info
  field_type: password
  name: Calendar (ICS link)
  optional: true
  help_text: "<p>The private ICS address of a calendar:</p><ul><li><b>Google Calendar</b>: Settings, Integrate calendar, Secret address in iCal format</li><li><b>Outlook</b>: Publish calendar</li><li><b>iCloud</b>: Public calendar link</li></ul><p>Treated as a secret: only used to fetch your events, never shown, logged or passed on. A calendar over 2 MB, or one that is slow to answer, shows no agenda.</p>"
- keyname: weather_location
  group: Info
  field_type: string
  name: Weather location
  optional: true
  placeholder: Paris, France
  help_text: "<p>A city or place name, or latitude and longitude (<code>48.85, 2.35</code>).</p><p>TRMNL does not share your location, so the weather needs this. Weather from Open-Meteo (no account needed); the forecast line is in English.</p>"
- keyname: temperature_unit
  group: Info
  field_type: select
  name: Temperature unit
  default: c
  optional: true
  help_text: "<p>Celsius by default.</p>"
  options:
  - Celsius: c
  - Fahrenheit: f
- keyname: time_format
  group: Info
  field_type: select
  name: Time format
  default: 24h
  optional: true
  help_text: "<p>How the times of the agenda events are written. 24-hour by default.</p>"
  options:
  - "24-hour (13:30)": 24h
  - "12-hour (1:30 PM)": 12h
name: Masterworks
description: A new famous artwork each refresh
refresh_interval: 60
