---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor:
polling_url: ''
polling_headers: ''
polling_body: ''
id: 543128
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: '<strong>A famous public-domain artwork, new at every refresh.</strong><br />5,120 paintings, prints, posters and illustrations, about 4,660 of them with Family friendly on. Landscapes 620, seas 364, cities 421, modern and abstract 400, posters and Art Nouveau 295, nature illustration 301, Japanese prints 331, flowers and still life 245, portraits 594, religious 589, mythology 168, history 99, everyday scenes 273, other 420.<br />A work is picked at random, the well known ones more often; with no genre ticked, landscapes, cities, nature, prints, modern art and posters come up more often than religious art, portraits and history. A work fills the screen when that crops almost nothing, otherwise it hangs on a white or black mat with a museum label. Source: Wikidata and Wikimedia Commons.'
  category: art,images
  github_url: https://github.com/ExcuseMi/trmnl-masterworks-plugin
  learn_more_url: https://www.wikidata.org
- keyname: label
  field_type: boolean
  name: Museum label
  default: 'true'
  optional: true
  help_text: "<b>On</b>: title, artist and year, then technique and where the work hangs, as on a museum wall. <b>Off</b>: only the artwork."
- keyname: family_friendly
  group: Selection
  field_type: boolean
  name: Family friendly
  default: 'true'
  optional: true
  help_text: "<b>On</b> (default): leaves out works whose subject is nudity or graphic violence (nudes, bathers, Venus, beheadings, massacres, executions, martyrdoms, battles). The list comes from Wikidata's subjects and the titles, so it is careful but not perfect.<br /><b>Off</b>: all works."
- keyname: genres
  group: Selection
  field_type: select
  multiple: true
  name: Genres
  optional: true
  help_text: Tick the kinds of work you want; nothing ticked gives the default mix, which shows landscapes, seas, cities, nature illustration, Japanese prints, modern and abstract art and posters more often, and flowers and still life, religious art, portraits and history painting less often. With too few works of the ticked kinds, the default mix is used for that refresh. Tick only Portraits for portraits; tick every kind but Portraits to leave them out.
  options:
  - Landscapes and seas: landscapes
  - Cities: cities
  - Flowers and still life: flowers_still_life
  - Nature illustration: nature
  - Japanese prints: japanese_prints
  - Modern and abstract: modern
  - Posters and Art Nouveau: posters
  - Religious: religious
  - History and mythology: history_myth
  - Everyday scenes: everyday
  - Portraits: portraits
- keyname: movement
  group: Selection
  field_type: select
  name: Period
  default: all
  optional: true
  help_text: Only works of one movement or period. With few works in a period the filter is ignored for that refresh.
  options:
  - All: all
  - Renaissance: Renaissance
  - Baroque: Baroque
  - Impressionism: Impressionism
  - Post-Impressionism: Post-Impressionism
  - Dutch Golden Age: Dutch Golden Age
  - Realism: Realism
  - Mannerism: Mannerism
  - Romanticism: Romanticism
  - Neoclassicism: Neoclassicism
  - Rococo: Rococo
name: Masterworks
description: A new famous artwork each refresh
refresh_interval: 60
