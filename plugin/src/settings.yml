---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor:
polling_url: ''
polling_headers: ''
polling_body: ''
id: 543128
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: '<strong>A famous public-domain artwork, new at every refresh.</strong><br />5,000+ paintings, prints, posters and illustrations. Landscapes 588, seas 364, cities 414, modern and abstract 433, posters and Art Nouveau 292, nature illustration 301, Japanese prints 330, flowers and still life 236, portraits 570, religious 576, mythology 156, history 94, everyday scenes 270, other 386.<br />A work is picked at random, the well known ones more often; with no genre ticked, landscapes, cities, nature, prints, modern art and posters come up more often than religious art, portraits and history. A work fills the screen when that crops almost nothing, otherwise it hangs on a white or black mat with a museum label. Source: Wikidata and Wikimedia Commons.'
  category: art,images
  github_url: https://github.com/ExcuseMi/trmnl-masterworks-plugin
  learn_more_url: https://www.wikidata.org
- keyname: label
  field_type: boolean
  name: Museum label
  default: 'true'
  optional: true
  help_text: "<b>On</b>: title, artist and year, then technique and where the work hangs, as on a museum wall. <b>Off</b>: only the artwork."
- keyname: show_date
  group: Info strip
  field_type: boolean
  name: Show the date
  default: 'false'
  optional: true
  help_text: "A calm strip at the bottom with the day number, weekday and month in your account's language. The artwork is shown in the space above it and the museum label moves into the strip (or is left out when the strip has no room). The strip appears when any of the three parts is on."
- keyname: show_weather
  group: Info strip
  field_type: boolean
  name: Show the weather
  default: 'false'
  optional: true
  help_text: "The temperature and a short forecast line from Open-Meteo. Needs a weather location; without one, or when the weather cannot be fetched, this part is left out."
- keyname: show_agenda
  group: Info strip
  field_type: boolean
  name: Show the agenda
  default: 'false'
  optional: true
  help_text: "Your next two events of today (tomorrow's from 6 pm, or when none is left) from a calendar link. Needs the calendar link below; without one nothing shows."
- keyname: ics_url
  group: Info strip
  field_type: password
  name: Calendar (ICS link)
  optional: true
  help_text: "The private ICS address of a calendar (Google Calendar: Settings, Integrate calendar, Secret address in iCal format; Outlook: Publish calendar; iCloud: Public calendar link). Treated as a secret: it is only used to fetch your events and is never shown, logged or passed on. A calendar larger than 2 MB, or one that is slow to answer, shows no agenda."
- keyname: weather_location
  group: Info strip
  field_type: string
  name: Weather location
  optional: true
  placeholder: Paris, France
  help_text: "A city or place name, or latitude and longitude (<code>48.85, 2.35</code>). TRMNL does not share your location, so the weather needs this. Weather from Open-Meteo (no account needed); the forecast line is in English."
- keyname: temperature_unit
  group: Info strip
  field_type: select
  name: Temperature unit
  default: auto
  optional: true
  help_text: "Auto: Fahrenheit for an account language of the United States, else Celsius."
  options:
  - Auto: auto
  - Celsius: c
  - Fahrenheit: f
- keyname: family_friendly
  group: Selection
  field_type: boolean
  name: Family friendly
  default: 'true'
  optional: true
  help_text: "<b>On</b> (default): leaves out works whose subject is nudity or graphic violence (nudes, bathers, Venus, beheadings, massacres, executions, martyrdoms, battles). The list comes from Wikidata's subjects and the titles, so it is careful but not perfect.<br /><b>Off</b>: all works."
- keyname: genres
  group: Selection
  field_type: select
  multiple: true
  name: Genres
  optional: true
  help_text: Tick the kinds of work you want; nothing ticked gives the default mix, which shows landscapes, seas, cities, nature illustration, Japanese prints, modern and abstract art and posters more often, and flowers and still life, religious art, portraits and history painting less often. With too few works of the ticked kinds, the default mix is used for that refresh. Tick only Portraits for portraits; tick every kind but Portraits to leave them out.
  options:
  - Landscapes and seas: landscapes
  - Cities: cities
  - Flowers and still life: flowers_still_life
  - Nature illustration: nature
  - Japanese prints: japanese_prints
  - Modern and abstract: modern
  - Posters and Art Nouveau: posters
  - Religious: religious
  - History and mythology: history_myth
  - Everyday scenes: everyday
  - Portraits: portraits
- keyname: movement
  group: Selection
  field_type: select
  name: Period
  default: all
  optional: true
  help_text: Only works of one movement or period. With few works in a period the filter is ignored for that refresh.
  options:
  - All: all
  - Renaissance: Renaissance
  - Baroque: Baroque
  - Impressionism: Impressionism
  - Post-Impressionism: Post-Impressionism
  - Dutch Golden Age: Dutch Golden Age
  - Realism: Realism
  - Mannerism: Mannerism
  - Romanticism: Romanticism
  - Neoclassicism: Neoclassicism
  - Rococo: Rococo
name: Masterworks
description: A new famous artwork each refresh
refresh_interval: 60
