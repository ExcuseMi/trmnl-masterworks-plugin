---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: node
refresh_interval_floor:
polling_url: ''
polling_headers: ''
polling_body: ''
id: 543128
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: A famous painting, print or drawing from the public domain, a new one at every refresh, filling the whole screen. About 2,000 well-known works chosen by how widely they are written about, drawn from Wikidata and Wikimedia Commons; works whose colours suit colour e-paper come up more often.<br />Faithful photographs of two-dimensional public-domain works are themselves public domain. Each work is credited on its label.
  category: art,images
  github_url: https://github.com/ExcuseMi/trmnl-masterworks-plugin
  learn_more_url: https://www.wikidata.org
- keyname: presentation
  field_type: select
  name: Presentation
  default: gallery
  help_text: "<b>Gallery</b>: the work hangs centred on a white or black mat with a thin line around it and a museum label (title, artist, year, material, size, collection).<br /><b>Full screen</b>: the work fills the whole screen."
  options:
  - Gallery: gallery
  - Full screen: full
  conditional_validation:
  - when: gallery
    hidden:
    - fit
- keyname: fit
  field_type: select
  name: Fit (Full screen)
  default: fill
  optional: true
  help_text: 'Full screen only.<br /><b>Fill</b>: the work covers the whole screen, the edges are cropped. Works shaped like your screen are picked first.<br /><b>Whole work</b>: nothing is cut off; a plain white mat fills what is left.'
  options:
  - Fill (crop the edges): fill
  - Whole work (plain mat): whole
- keyname: label
  field_type: select
  name: Label
  default: corner
  help_text: "<b>Gallery</b>: the museum label on the mat, or off.<br /><b>Full screen</b>: a small corner placard, or off."
  options:
  - Show the label: corner
  - 'Off': 'off'
- keyname: movement
  field_type: select
  name: Movement or period
  default: all
  optional: true
  help_text: Only works of one movement. With few works in a movement the filter is ignored.
  options:
  - All: all
  - Renaissance: Renaissance
  - Baroque: Baroque
  - Impressionism: Impressionism
  - Post-Impressionism: Post-Impressionism
  - Dutch Golden Age: Dutch Golden Age
  - Realism: Realism
  - Mannerism: Mannerism
  - Romanticism: Romanticism
  - Neoclassicism: Neoclassicism
  - Rococo: Rococo
name: Masterworks
description: A new famous artwork each refresh
refresh_interval: 60
