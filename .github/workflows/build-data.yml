# Rebuilds data/*.json from Wikidata and Wikimedia Commons and commits the result. By hand only (owner 2026-11-19): data on main
# is live for every user at once, and new works must be judged by the curator and looked at first. No schedule.
name: build-data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests of the build tool
        run: node --test tools/build_works/test
      - name: Build the data set
        run: node tools/build_works/build.mjs
      - name: The new data passes its tests and the plugin's (part counts, limits)
        run: node --test tools/build_works/test plugin/test
      - name: Commit when it changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Rebuild data set" && git push; }
