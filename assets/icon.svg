<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Masterworks</title>
  <!-- oak frame: four mitred sides, light from the top left -->
  <path d="M4 4 H60 L54 10 H10 Z" fill="#d4a165"/>
  <path d="M4 4 L10 10 V54 L4 60 Z" fill="#c48f55"/>
  <path d="M60 4 V60 L54 54 V10 Z" fill="#a06c38"/>
  <path d="M4 60 L10 54 H54 L60 60 Z" fill="#9a6633"/>
  <!-- grain -->
  <g stroke="#8a5a2b" stroke-width="0.5" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M12 6.2 C24 5.6 36 7 52 6.4"/><path d="M16 8 C28 7.4 40 8.6 50 8.1"/>
    <path d="M14 57.8 C26 58.4 40 57.2 50 57.8"/>
    <path d="M6.3 14 C5.8 26 7 40 6.4 50"/><path d="M57.7 16 C58.3 28 57.1 40 57.7 50"/>
  </g>
  <!-- mitre lines -->
  <g stroke="#7a4e24" stroke-width="0.6" opacity="0.7"><path d="M4 4 L10 10 M60 4 L54 10 M4 60 L10 54 M60 60 L54 54"/></g>
  <!-- thin inner lip -->
  <rect x="10" y="10" width="44" height="44" fill="#f3ead8"/>
  <!-- Mondrian composition -->
  <rect x="11.5" y="11.5" width="41" height="41" fill="#ffffff"/>
  <rect x="11.5" y="11.5" width="23.5" height="23.5" fill="#e0322b"/>
  <rect x="38" y="42" width="14.5" height="10.5" fill="#2f5fc4"/>
  <rect x="11.5" y="45" width="9.5" height="7.5" fill="#ffd21f"/>
  <g fill="#1a1a1a">
    <rect x="35" y="11.5" width="3" height="41"/>
    <rect x="11.5" y="35" width="41" height="3"/>
    <rect x="21" y="38" width="2.5" height="14.5"/>
    <rect x="11.5" y="42.5" width="9.5" height="2.5"/>
    <rect x="38" y="25" width="14.5" height="2.5"/>
    <rect x="38" y="39.5" width="14.5" height="2.5"/>
  </g>
</svg>
