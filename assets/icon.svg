  <rect x="38" y="42" width="15" height="11" fill="#2f5fc4"/>
  <rect x="11" y="45" width="10" height="8" fill="#ffd21f"/>
  <g fill="#1a1a1a">
    <rect x="35" y="11" width="3" height="42"/>
    <rect x="11" y="35" width="42" height="3"/>
    <rect x="21" y="38" width="2.5" height="15"/>
